<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07070b">
<title>DarkSide · Avance de proyectos</title>
<style>
  html,body{margin:0;height:100%;background:#07070b}
  /* 100dvh: en iPhone no queda tapado por la barra de Safari */
  iframe{display:block;border:0;width:100%;height:100vh;height:100dvh}
</style>
</head>
<body>
<iframe id="portal" title="DarkSide · Avance de proyectos"></iframe>
<script>
  // URL /exec de la web app (Implementar → Administrar implementaciones). Es lo único a cambiar si se re-implementa con otro ID.
  var EXEC = 'https://script.google.com/macros/s/AKfycbzUcTboD0XhvgviLLmWS0WrEn9jT2TZGk2l9WJ8f_1kqRK7DbnHomzSVfmim8DQhm4daA/exec';
  // Pasa el ?k= de los links de prueba al portal.
  document.getElementById('portal').src = EXEC + location.search;
</script>
</body>
</html>
